# Pipeline policy - single source of truth for thresholds used by the orchestrator (A1),
# rating (A3) and monitoring (A4). Change only via PR reviewed by A1.
version: 1

llm:
  # EUR per 1k tokens; used for Usage.cost_eur (process-improvement KPIs). Keyed by model/deployment name.
  pricing_eur_per_1k:
    default: { prompt: 0.00014, completion: 0.00055 }
    gpt-4o-mini: { prompt: 0.00014, completion: 0.00055 }
    gpt-4o: { prompt: 0.0023, completion: 0.0092 }
    gpt-5-mini: { prompt: 0.00022, completion: 0.0017 }   # ~USD 0.25 / 2.00 per 1M tokens; confirm on Azure pricing
  # role -> model override (falls back to MRF_LLM_MODEL; 'rater' also honours MRF_LLM_REVIEWER_MODEL)
  role_models: {}
  max_retry_after_s: 8
  json_repair_attempts: 1

classification:
  min_confidence: 0.7            # below -> MRF-2002, manual_review

retries:
  doc_quality_max_attempts: 3    # draft+rate loops; no waiting between attempts
  parity_max_attempts: 5         # rebuild self-heal loops
  llm_transient:                 # rate limit / timeout, per single LLM call
    max_retries: 3
    base_delay_s: 1.0            # 1s, 2s, 4s
    max_jitter_s: 0.5
    timeout_s: 60

rating:
  pass_score: 80
  rule_weight: 60
  llm_weight: 40
  veto_flags: [fabricated_variable, fabricated_number]

parity:
  abs_tolerance: 1.0e-6          # per-record score difference
  match_rate_required: 1.0

gates:
  H1: { name: doc_approval, required: true }
  H2: { name: validation_signoff, required: true }

monitoring:
  psi_amber: 0.10
  psi_red: 0.25
  gini_drop_red: 0.05
  manual_queue_sla_hours: 24
  # per-batch data quality (A4). Value ranges / allowed codes come from the pandera schema, not from here.
  min_rows: 30                   # fewer rows -> amber (0 rows -> red)
  missing_rate_amber: 0.05       # share of missing values in any column
  missing_rate_red: 0.20
  default_schedule_cron: "0 6 * * 1"   # every Monday 06:00 UTC; demo overrides to hourly

reporting:
  # Analysis / validation report traffic lights (A3). Team policy proposed by A3 - confirm before the demo.
  # Stability (score PSI) reuses monitoring.psi_amber / psi_red above.
  gini_green: 0.40               # performance: Gini >= green -> green, >= amber -> amber, else red
  gini_amber: 0.30
  hl_p_value_amber: 0.05         # calibration: Hosmer-Lemeshow p-value below this -> performance at least amber
  disparate_impact_green: 0.80   # fairness: four-fifths rule on approval rates across segments
  disparate_impact_amber: 0.70
  fairness_segment_column: age_band
  # Process-improvement baseline: hours to document + rebuild one model by hand (A2 timing study, 11/11).
  # null = not measured yet -> reports show no savings rather than an invented number.
  manual_baseline_hours: null
  analyst_cost_eur_per_hour: null
