[project]
name = "mrf"
version = "0.1.0"
description = "Model Risk Factory - agentic model inventory, documentation, rating, rebuild, validation and monitoring (EXL Hackathon C04, Team A)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "EXL C04 Team A" }]
# Core runtime: API + orchestrator + LLM wrapper + MCP tool server.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0",
    "aiosqlite>=0.20",
    "openai>=1.40",
    "mcp>=1.9",
]

[project.optional-dependencies]
# A2 data cleaning / legacy model reproduction / A3 validation metrics.
# Readers for many formats are included on purpose: the datasets are not fixed yet.
data = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "pandera>=0.20",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "xgboost>=2.0",
    "openpyxl>=3.1",
    "pyreadstat>=1.2",
]
# A3 RAG knowledge base (FAISS locally, Azure AI Search in cloud).
rag = ["faiss-cpu>=1.8", "azure-search-documents>=11.4"]
# Cloud adapters (A1 storage, A4 infra/monitoring).
azure = [
    "azure-identity>=1.17",
    "azure-cosmos>=4.7",
    "azure-storage-blob>=12.20",
    "azure-monitor-opentelemetry>=1.6",
]
mlops = ["mlflow>=2.14"]
ui = ["streamlit>=1.36", "plotly>=5.22"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "bandit>=1.7",
    "pre-commit>=3.7",
    "types-PyYAML",
]

[project.scripts]
mrf = "mrf.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mrf"]

# ---------------------------------------------------------------- tooling
[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "UP042"]  # Chinese punctuation; str+Enum kept for py3.11 json clarity

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
packages = ["mrf"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs local services (sqlite, mcp) but no real LLM",
    "llm: calls a real LLM - excluded from CI, used by nightly-eval",
]
addopts = "-m 'not llm'"

[tool.bandit]
exclude_dirs = ["tests"]
