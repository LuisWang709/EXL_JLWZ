# Owner: A4. After CI passes on main: build images in ACR, update the dev Container Apps, smoke test,
# roll back the API image if the smoke test fails. Needs (repo Settings -> Secrets and variables -> Actions):
#   secrets   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID (OIDC, id-mrf-github), MRF_DEV_API_KEY
#   variables ACR_NAME
name: cd-dev

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: cd-dev
  cancel-in-progress: false

env:
  RG: rg-mrf-a-dev
  API_APP: mrf-api-dev
  UI_APP: mrf-ui-dev
  ACR: ${{ vars.ACR_NAME }}
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - run: az config set extension.use_dynamic_install=yes_without_prompt

      - name: Build API image in ACR (amd64, no Docker on the runner)
        run: az acr build -r "$ACR" -t "mrf-api:$IMAGE_TAG" -f docker/Dockerfile.api . --no-logs

      - name: Build UI image in ACR (once docker/Dockerfile.ui exists)
        if: ${{ hashFiles('docker/Dockerfile.ui') != '' }}
        run: az acr build -r "$ACR" -t "mrf-ui:$IMAGE_TAG" -f docker/Dockerfile.ui . --no-logs

      - name: Remember the running API image
        id: prev
        run: |
          echo "image=$(az containerapp show -n "$API_APP" -g "$RG" \
            --query 'properties.template.containers[0].image' -o tsv)" >> "$GITHUB_OUTPUT"

      - name: Deploy
        run: |
          az containerapp update -n "$API_APP" -g "$RG" --image "$ACR.azurecr.io/mrf-api:$IMAGE_TAG" -o none
          if [ -f docker/Dockerfile.ui ] && az containerapp show -n "$UI_APP" -g "$RG" -o none 2>/dev/null; then
            az containerapp update -n "$UI_APP" -g "$RG" --image "$ACR.azurecr.io/mrf-ui:$IMAGE_TAG" -o none
          fi

      - name: Smoke test
        env:
          API_KEY: ${{ secrets.MRF_DEV_API_KEY }}
        run: |
          URL="https://$(az containerapp show -n "$API_APP" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)"
          for i in $(seq 1 20); do
            if curl -fsS "$URL/healthz" >/dev/null; then break; fi
            echo "waiting for the new revision ($i)"; sleep 15
          done
          curl -fsS "$URL/healthz"
          curl -fsS "$URL/readyz"
          curl -fsS -H "X-API-Key: $API_KEY" "$URL/api/v1/models" >/dev/null
          echo "smoke test passed: $URL"

      - name: Roll back the API on failure
        if: ${{ failure() && steps.prev.outputs.image != '' }}
        run: az containerapp update -n "$API_APP" -g "$RG" --image "${{ steps.prev.outputs.image }}" -o none
