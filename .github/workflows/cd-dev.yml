# Owner: A4. After CI passes on main: build the images on the runner and push them to ACR, update the dev
# Container Apps, smoke test, roll back the API image if the smoke test fails. ACR Tasks (az acr build) is not
# allowed on Azure for Students, so the build runs here. Before dev exists (first-time setup) it only pushes the
# image and prints the API_IMAGE to use for infra/main.bicep. Needs (repo Settings -> Secrets and variables -> Actions):
#   secrets   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID (OIDC, id-mrf-github), MRF_DEV_API_KEY
#   variables ACR_NAME
name: cd-dev

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: cd-dev
  cancel-in-progress: false

env:
  RG: rg-mrf-a-dev
  API_APP: mrf-api-dev
  UI_APP: mrf-ui-dev
  ACR: ${{ vars.ACR_NAME }}
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - run: az config set extension.use_dynamic_install=yes_without_prompt

      - name: Log in to ACR (id-mrf-github has AcrPush)
        run: az acr login -n "$ACR"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push the API image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          platforms: linux/amd64
          push: true
          tags: ${{ vars.ACR_NAME }}.azurecr.io/mrf-api:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the UI image (once docker/Dockerfile.ui exists)
        if: ${{ hashFiles('docker/Dockerfile.ui') != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.ui
          platforms: linux/amd64
          push: true
          tags: ${{ vars.ACR_NAME }}.azurecr.io/mrf-ui:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui

      - name: Remember the running API image (empty = dev not deployed yet)
        id: prev
        run: |
          IMAGE=$(az containerapp show -n "$API_APP" -g "$RG" \
            --query 'properties.template.containers[0].image' -o tsv 2>/dev/null || true)
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          if [ -z "$IMAGE" ]; then
            echo "::notice::$API_APP is not deployed yet - image pushed only. First-time setup: export API_IMAGE=$ACR.azurecr.io/mrf-api:$IMAGE_TAG and deploy infra/main.bicep (infra/README.md)."
          fi

      - name: Deploy
        if: ${{ steps.prev.outputs.image != '' }}
        run: |
          az containerapp update -n "$API_APP" -g "$RG" --image "$ACR.azurecr.io/mrf-api:$IMAGE_TAG" -o none
          if [ -f docker/Dockerfile.ui ] && az containerapp show -n "$UI_APP" -g "$RG" -o none 2>/dev/null; then
            az containerapp update -n "$UI_APP" -g "$RG" --image "$ACR.azurecr.io/mrf-ui:$IMAGE_TAG" -o none
          fi

      - name: Smoke test
        if: ${{ steps.prev.outputs.image != '' }}
        env:
          API_KEY: ${{ secrets.MRF_DEV_API_KEY }}
        run: |
          URL="https://$(az containerapp show -n "$API_APP" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)"
          for i in $(seq 1 20); do
            if curl -fsS "$URL/healthz" >/dev/null; then break; fi
            echo "waiting for the new revision ($i)"; sleep 15
          done
          curl -fsS "$URL/healthz"
          curl -fsS "$URL/readyz"
          curl -fsS -H "X-API-Key: $API_KEY" "$URL/api/v1/models" >/dev/null
          echo "smoke test passed: $URL"

      - name: Roll back the API on failure
        if: ${{ failure() && steps.prev.outputs.image != '' }}
        run: az containerapp update -n "$API_APP" -g "$RG" --image "${{ steps.prev.outputs.image }}" -o none
