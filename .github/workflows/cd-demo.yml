# Owner: A4. Manual: Actions -> cd-demo -> Run workflow (branch: main) -> tag, e.g. v0.9.0.
# Deploys the image that cd-dev already built and tested for that tag's commit - nothing is rebuilt.
# Runs from main so the OIDC subject stays repo:<owner>@<id>/<repo>@<id>:ref:refs/heads/main (one federated credential).
#   secrets   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, MRF_DEMO_API_KEY
#   variables ACR_NAME
name: cd-demo

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "git tag to deploy (its commit must have been built by cd-dev)"
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: cd-demo
  cancel-in-progress: false

env:
  RG: rg-mrf-a-demo
  API_APP: mrf-api-demo
  UI_APP: mrf-ui-demo
  ACR: ${{ vars.ACR_NAME }}

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the tag to a commit
        id: sha
        run: echo "sha=$(git rev-list -n 1 "${{ inputs.tag }}")" >> "$GITHUB_OUTPUT"

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - run: az config set extension.use_dynamic_install=yes_without_prompt

      - name: Check the tested image exists
        run: |
          az acr repository show -n "$ACR" --image "mrf-api:${{ steps.sha.outputs.sha }}" -o none || {
            echo "::error::no mrf-api image for ${{ inputs.tag }} - tag a commit on main that cd-dev deployed"; exit 1; }

      - name: Remember the running API image
        id: prev
        run: |
          echo "image=$(az containerapp show -n "$API_APP" -g "$RG" \
            --query 'properties.template.containers[0].image' -o tsv)" >> "$GITHUB_OUTPUT"

      - name: Deploy
        run: |
          SHA="${{ steps.sha.outputs.sha }}"
          az containerapp update -n "$API_APP" -g "$RG" --image "$ACR.azurecr.io/mrf-api:$SHA" -o none
          if az acr repository show -n "$ACR" --image "mrf-ui:$SHA" -o none 2>/dev/null \
             && az containerapp show -n "$UI_APP" -g "$RG" -o none 2>/dev/null; then
            az containerapp update -n "$UI_APP" -g "$RG" --image "$ACR.azurecr.io/mrf-ui:$SHA" -o none
          fi

      - name: Smoke test
        env:
          API_KEY: ${{ secrets.MRF_DEMO_API_KEY }}
        run: |
          URL="https://$(az containerapp show -n "$API_APP" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)"
          for i in $(seq 1 20); do curl -fsS "$URL/healthz" >/dev/null && break; sleep 15; done
          curl -fsS "$URL/readyz"
          curl -fsS -H "X-API-Key: $API_KEY" "$URL/api/v1/models" >/dev/null
          echo "demo ${{ inputs.tag }} is live: $URL"

      - name: Roll back on failure
        if: ${{ failure() && steps.prev.outputs.image != '' }}
        run: az containerapp update -n "$API_APP" -g "$RG" --image "${{ steps.prev.outputs.image }}" -o none
